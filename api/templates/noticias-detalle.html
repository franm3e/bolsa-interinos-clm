<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">

    <script type="text/javascript" src="{% static 'js/global.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/noticias.js' %}"></script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5114720014121335" crossorigin="anonymous"></script>

    <title>Noticias - Bolsa Educación Interinos CLM</title>

    {% include 'imports.html' %}
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container">
        <div class="row d-none">
            <div class="col">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-5114720014121335"
                     data-ad-slot="3602108168"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </div>
        <div class="row align-items-center justify-content-start mt-5 mx-3">
            <div class="col">
                <p class="h1 text-justify">{{ noticia.titulo }}</p>
            </div>
        </div>
        <div class="row align-items-center justify-content-start m-3">
            <div class="col">
                <p class="fs-4">{{ noticia.resumen }}</p>
            </div>
        </div>
        <div class="row align-items-center justify-content-start m-3">
            <div class="col-auto">
                <img src="/staticfiles/images/categorias/{{ noticia.categoria.nombre }}.png" class="img-fluid" alt="{{ noticia.categoria }}" style="max-height: 300px;">
            </div>
        </div>
        <div class="row align-items-center justify-content-start mx-3 mb-4">
            <div class="col-auto">
                <small><p class="fw-semibold m-0">Bolsa Educación Interinos CLM</p></small>
            </div>
            <div class="col-auto">
                <small><p class="fw-semibold m-0">{{ noticia.fecha_creacion|date:"d/m/Y" }}</p></small>
            </div>
        </div>
        <div class="row align-items-center justify-content-center mx-3">
            <div class="col">
                <p class="lh-base">{{ noticia.cuerpo|safe }}</p>
            </div>
        </div>
    </div>

    {% include 'footer.html' %}
</body>
</html>
